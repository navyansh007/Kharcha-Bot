<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pay {{.Name}}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 22rem; margin: 3rem auto; padding: 0 1rem; text-align: center; }
    a, button { display: block; width: 100%; box-sizing: border-box; padding: 0.9rem; margin-top: 1rem; border-radius: 0.5rem; font-size: 1rem; }
    a { background: #1a73e8; color: #fff; text-decoration: none; }
    button { background: #fff; border: 1px solid #ccc; }
    code { display: block; margin-top: 1rem; font-size: 1.1rem; word-break: break-all; }
  </style>
</head>
<body>
  <h1>{{.Amount}}</h1>
  <p>to {{.Name}}</p>
  <a href="{{.Link}}">Open UPI app</a>
  <code id="vpa">{{.VPA}}</code>
  <button type="button" id="copy">Copy UPI ID</button>
  <p>Once you have paid, go back to Telegram and tap <b>Mark settled</b>.</p>
  <script>
    document.getElementById("copy").addEventListener("click", function () {
      navigator.clipboard.writeText(document.getElementById("vpa").textContent);
      this.textContent = "Copied";
    });
    window.location.href = {{.Link}};
  </script>
</body>
</html>
