version: "2"
run:
  build-tags:
    - integration
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G115
  exclusions:
    rules:
      - path: internal/httpserver/pay\.go
        linters:
          - gosec
        text: G203
      - path: _test\.go
        linters:
          - gosec
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/navyansh007/kharcha-bot
